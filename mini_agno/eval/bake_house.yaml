cases:
  - input: "001烤房温度38.2度，湿度80.1，该调多大火力？"
    mode: keyword
    keywords: ["提升火力", "38.2"]

  - input: "001烤房温度45.0度，湿度75，该调多大火力？"
    mode: keyword
    keywords: ["保持火力"]

  - input: "001烤房温度38.2度，湿度80.1，该调多大火力？"
    mode: judge
    rubric: |
      1-10分。10分标准：温度<40应建议"提升火力"；引用了真实数值；说明了理由。凡编造数值直接1分。

  - input: "002烤房温度52.3度，湿度60，给出火力操作建议并解释原因"
    mode: judge
    rubric: |
      1-10分。10分标准：温度>=50应建议"降低火力"；必须引用真实数值52.3；说明理由。凡编造数值直接1分。
