[project]
name = "mini-agno"
version = "0.1.0"
description = "A minimal agent framework built from scratch to learn how agno is designed (12-module build-to-learn project)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_agno"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=26.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
